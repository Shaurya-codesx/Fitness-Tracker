name: Android CI


on:
  push:
    branches: [ "main", "master" ] # Wake up when code is pushed to the main branch
  pull_request:
    branches: [ "main", "master" ] # Wake up when someone asks to merge code

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest


      - name: Build Debug APK
        run: ./gradlew assembleDebug